<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy statement | Alaga Aesthetics by Bosselaar</title>
<meta name="description" content="Regenerative aesthetic products, training and home skincare for clinics and patients in the Netherlands.">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  :root { --ink:#0b1d4a; --soft:#3a4670; --cobalt:#24489a; --mist:#eef1f8; }
  *{box-sizing:border-box} body{margin:0;background:var(--mist);color:var(--ink);font:400 1.0625rem/1.65 "Libre Franklin",Arial,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(18px,4vw,48px);background:var(--cobalt);color:#fff}
  header a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:500}
  header img{width:32px;height:32px}
  button{font:500 .9rem "Libre Franklin",sans-serif;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 16px;cursor:pointer}
  main{max-width:720px;margin:0 auto;padding:clamp(40px,7vw,88px) clamp(18px,4vw,48px)}
  h1{font:500 clamp(2rem,4vw,2.8rem)/1.15 "Spectral",Georgia,serif;margin:0 0 20px}
  h2{font:600 1.05rem "Libre Franklin",sans-serif;margin:32px 0 6px}
  p{margin:0 0 1em;text-wrap:pretty} .intro{font:400 1.3rem/1.5 "Spectral",Georgia,serif}
  .updated{color:var(--soft);font-size:.9rem;margin-top:36px}
  a{color:var(--cobalt)} :focus-visible{outline:2px solid var(--cobalt);outline-offset:3px} header :focus-visible{outline-color:#fff}
</style>
</head>
<body data-title-suffix="privacy.title">
<header>
  <a href="../a/" data-keep-lang><img src="../assets/img/mark-white.svg" alt=""><span data-t="privacy.back">Back to the site</span></a>
  <button type="button" data-lang-toggle>Nederlands</button>
</header>
<main>
  <h1 data-t="privacy.title">Privacy statement</h1>
  <p class="intro" data-t="privacy.intro"></p>
  <h2 data-t="privacy.h1"></h2><p data-t="privacy.p1"></p>
  <h2 data-t="privacy.h2"></h2><p data-t="privacy.p2"></p>
  <h2 data-t="privacy.h3"></h2><p data-t="privacy.p3"></p>
  <h2 data-t="privacy.h4"></h2><p data-t="privacy.p4"></p>
  <h2 data-t="privacy.h5"></h2><p data-t="privacy.p5"></p>
  <p class="updated" data-t="privacy.updated"></p>
</main>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/site.js"></script>
</body>
</html>
