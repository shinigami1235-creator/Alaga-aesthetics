<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alaga Aesthetics by Bosselaar</title>
<meta name="description" content="Regenerative aesthetic products, training and home skincare for clinics and patients in the Netherlands.">
<meta name="theme-color" content="#24489A">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/spectral-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-layout="a">
<a class="skip" href="#main" data-t="skip">Skip to content</a>

<header class="cover">
  <div class="cover-field">
    <div class="cover-top">
      <a class="wordmark" href="#top" aria-label="Alaga Aesthetics by Bosselaar">
        <img src="../assets/img/mark-white.svg" alt="" class="wordmark-mark">
        <span class="wordmark-text">Alaga Aesthetics <span data-t="brand.by">by Bosselaar</span></span>
      </a>
      <button type="button" class="lang" data-lang-toggle>Nederlands</button>
    </div>

    <div class="entry" id="top">
      <h1 class="entry-word" data-t="def.word">alaga</h1>
      <p class="entry-meaning" data-t="def.meaning">Care, the act of looking after someone.</p>
    </div>

    <p class="cover-lead" data-t="intro.lead"></p>

    <nav class="toc" aria-labelledby="toc-title">
      <h2 class="toc-title" id="toc-title" data-t="a.contents">Contents</h2>
      <ol class="toc-list">
        <li><a href="#about" data-t="nav.about"></a></li>
        <li><a href="#practitioners" data-t="nav.practitioners"></a></li>
        <li><a href="#patients" data-t="nav.patients"></a></li>
        <li><a href="#founders" data-t="nav.founders"></a></li>
        <li><a href="#roadmap" data-t="nav.roadmap"></a></li>
        <li><a href="#contact" data-t="nav.contact"></a></li>
      </ol>
      <a class="cover-cta" href="#register" data-t="nav.register"></a>
    </nav>
  </div>

  <figure class="cover-figure">
    <div class="cover-plate">
      <img src="../assets/img/engraving.webp" width="1400" height="1400" alt="" data-t-alt="engraving.alt" class="develop">
      <img src="../assets/img/mark-cobalt.svg" alt="" class="plate-mark">
    </div>
    <figcaption><span class="fig-no"><span data-t="a.fig">Fig.</span> 1</span> <span data-t="engraving.cap"></span></figcaption>
  </figure>
</header>

<main id="main">

  <section class="article" id="about" aria-labelledby="about-h">
    <div class="article-side">
      <h2 id="about-h" data-t="nav.about">About</h2>
    </div>
    <div class="article-body">
      <p class="lede" data-t="intro.body"></p>
      <p class="status"><span class="status-dot" aria-hidden="true"></span><span data-t="intro.status"></span></p>
    </div>
  </section>

  <section class="paths" aria-labelledby="paths-h">
    <h2 class="visually-hidden" id="paths-h" data-t="paths.title">Choose your path</h2>

    <article class="path path-prac" id="practitioners" aria-labelledby="prac-h">
      <figure class="path-figure">
        <img src="https://images.unsplash.com/photo-1630959305606-3123a081dada?auto=format&fit=crop&w=900&h=1100&q=72"
             width="900" height="1100" loading="lazy" alt="" data-t-alt="photo.pathologist.alt">
        <figcaption><span class="fig-no"><span data-t="a.fig">Fig.</span> 2</span> <span data-t="photo.pathologist.cap"></span></figcaption>
      </figure>
      <div class="path-text">
        <p class="path-for" data-t="prac.name">For practitioners</p>
        <h3 id="prac-h" data-t="prac.title">The Clinical Alliance</h3>
        <p class="path-lead" data-t="prac.lead"></p>
        <dl class="offer">
          <div><dt data-t="prac.i1.t"></dt><dd data-t="prac.i1.d"></dd></div>
          <div><dt data-t="prac.i2.t"></dt><dd data-t="prac.i2.d"></dd></div>
          <div><dt data-t="prac.i3.t"></dt><dd data-t="prac.i3.d"></dd></div>
          <div><dt data-t="prac.i4.t"></dt><dd data-t="prac.i4.d"></dd></div>
          <div><dt data-t="prac.i5.t"></dt><dd data-t="prac.i5.d"></dd></div>
        </dl>
        <a class="btn btn-cobalt" href="#register" data-t="prac.cta"></a>
      </div>
    </article>

    <article class="path path-pat" id="patients" aria-labelledby="pat-h">
      <figure class="path-figure">
        <img src="https://images.unsplash.com/photo-1655026392641-bf283a5f12d4?auto=format&fit=crop&w=900&h=1100&q=72"
             width="900" height="1100" loading="lazy" alt="" data-t-alt="photo.serum.alt">
        <figcaption><span class="fig-no"><span data-t="a.fig">Fig.</span> 3</span> <span data-t="photo.serum.cap"></span></figcaption>
      </figure>
      <div class="path-text">
        <p class="path-for" data-t="pat.name">For patients</p>
        <h3 id="pat-h" data-t="pat.title">The Skin Concierge</h3>
        <p class="path-lead" data-t="pat.lead"></p>
        <dl class="offer">
          <div><dt data-t="pat.i1.t"></dt><dd data-t="pat.i1.d"></dd></div>
          <div><dt data-t="pat.i2.t"></dt><dd data-t="pat.i2.d"></dd></div>
          <div><dt data-t="pat.i3.t"></dt><dd data-t="pat.i3.d"></dd></div>
        </dl>
        <a class="btn btn-rose" href="#contact" data-t="pat.cta"></a>
      </div>
    </article>

    <p class="stage-note" data-t="stage.note"></p>
  </section>

  <section class="article why" id="why" aria-labelledby="why-h">
    <div class="article-side">
      <h2 id="why-h" data-t="why.title">Why Alaga</h2>
    </div>
    <div class="article-body why-body">
      <div class="why-text">
        <p class="lede" data-t="why.p1"></p>
        <p data-t="why.p2"></p>
      </div>
      <figure class="loop">
        <svg viewBox="0 0 360 330" role="img" aria-labelledby="loop-title">
          <title id="loop-title" data-t="loop.title">How it fits together</title>
          <defs>
            <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
          </defs>
          <g class="loop-arcs" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#arr-a)">
            <path d="M206,58 A120,120 0 0 1 292,214"/>
            <path d="M262,262 A120,120 0 0 1 98,262"/>
            <path d="M68,214 A120,120 0 0 1 154,58"/>
          </g>
          <g class="loop-nodes">
            <circle cx="180" cy="48" r="36"/><circle cx="284" cy="240" r="36"/><circle cx="76" cy="240" r="36"/>
          </g>
          <g class="loop-labels" text-anchor="middle">
            <text x="180" y="53" data-t="loop.n1">Alaga</text>
            <text x="284" y="245" data-t="loop.n2">Clinic</text>
            <text x="76" y="245" data-t="loop.n3">Patient</text>
          </g>
        </svg>
        <figcaption>
          <span class="fig-no"><span data-t="a.fig">Fig.</span> 4</span> <span data-t="loop.title"></span>
          <ol class="loop-steps">
            <li data-t="loop.s1"></li>
            <li data-t="loop.s2"></li>
            <li data-t="loop.s3"></li>
          </ol>
        </figcaption>
      </figure>
    </div>
  </section>

  <figure class="plate">
    <img src="https://images.unsplash.com/photo-1716833322987-bfef9f913822?auto=format&fit=crop&w=2000&h=800&q=72"
         width="2000" height="800" loading="lazy" alt="" data-t-alt="photo.epidermis.alt">
    <figcaption><span class="fig-no"><span data-t="a.fig">Fig.</span> 5</span> <span data-t="photo.epidermis.cap"></span></figcaption>
  </figure>

  <section class="article" id="founders" aria-labelledby="founders-h">
    <div class="article-side">
      <h2 id="founders-h" data-t="founders.title">Founders</h2>
    </div>
    <div class="article-body founders">
      <div class="founder">
        <h3 data-t="f1.name"></h3>
        <p class="founder-role" data-t="f1.role"></p>
        <p data-t="f1.bio"></p>
      </div>
      <div class="founder">
        <h3 data-t="f2.name"></h3>
        <p class="founder-role" data-t="f2.role"></p>
        <p data-t="f2.bio"></p>
      </div>
    </div>
  </section>

  <section class="article" id="roadmap" aria-labelledby="roadmap-h">
    <div class="article-side">
      <h2 id="roadmap-h" data-t="roadmap.title">Roadmap</h2>
    </div>
    <div class="article-body">
      <ol class="timeline">
        <li><span class="when" data-t="r1.when"></span><span class="what" data-t="r1.what"></span></li>
        <li><span class="when" data-t="r2.when"></span><span class="what" data-t="r2.what"></span></li>
        <li><span class="when" data-t="r3.when"></span><span class="what" data-t="r3.what"></span></li>
      </ol>
    </div>
  </section>

  <section class="register" id="register" aria-labelledby="register-h">
    <div class="register-head">
      <h2 id="register-h" data-t="form.title">Register your clinic</h2>
      <p data-t="form.intro"></p>
    </div>
    <div data-register-form data-privacy="../privacy/"></div>
  </section>

  <section class="article contact" id="contact" aria-labelledby="contact-h">
    <div class="article-side">
      <h2 id="contact-h" data-t="contact.title">Contact</h2>
    </div>
    <div class="article-body">
      <p class="lede" data-t="contact.body"></p>
      <p><a class="mail" href="mailto:info@alagaaesthetics.nl" data-t="contact.email"></a></p>
    </div>
  </section>
</main>

<footer class="foot">
  <img src="../assets/img/mark-white.svg" alt="" class="foot-mark">
  <p data-t="footer.copy"></p>
  <a href="../privacy/" data-keep-lang data-t="footer.privacy"></a>
</footer>

<script src="../assets/js/content.js"></script>
