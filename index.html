<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alaga Aesthetics</title>
<meta name="description" content="Alaga Aesthetics helps doctors and nurses in the Netherlands plan, fund and set up their own aesthetic clinic.">
<meta name="theme-color" content="#F4F7FC">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/site.css">
<script type="importmap">{ "imports": { "three": "./assets/js/three.module.min.js" } }</script>
</head>
<body>
<a class="skip" href="#main" data-t="skip">Skip to content</a>

<header class="bar">
  <a class="brand" href="#top" aria-label="Alaga Aesthetics">
    <img src="assets/img/mark-cobalt.svg" alt="" class="brand-mark">
    <span class="brand-name">Alaga Aesthetics</span>
  </a>
  <!-- New services get a link here when they open: online store, Clinical Alliance. -->
  <nav class="bar-nav" aria-label="Main">
    <a href="#financing" data-t="nav.financing"></a>
    <a href="skin-check/" data-t="nav.skin"></a>
    <a href="ask/" data-t="nav.ask"></a>
    <a href="#founders" data-t="nav.founders"></a>
    <a href="#contact" data-t="nav.contact"></a>
  </nav>
  <button type="button" class="lang" data-lang-toggle hidden>Nederlands</button>
</header>

<main id="main">
  <section class="hero" id="top" aria-labelledby="hero-h">
    <div class="stage">
      <div class="stage-wreath" data-wreath aria-hidden="true">
        <img class="wreath-fallback" src="assets/img/mark-cobalt.svg" alt="">
      </div>
      <h1 class="seal" id="hero-h">
        <span class="seal-name">Alaga</span>
        <span class="seal-rule" aria-hidden="true"><svg viewBox="0 0 18 14"><path fill="currentColor" d="M9 1c2 2.2 2 5.2 0 7.4C7 6.2 7 3.2 9 1Zm-1 8.6C5.6 9.9 3.3 8.6 2 6.4c2.5-.4 4.8.8 6 3.2Zm2 0c1.2-2.4 3.5-3.6 6-3.2-1.3 2.2-3.6 3.5-6 3.2ZM8.4 9.8h1.2V13H8.4z"/></svg></span>
        <span class="seal-sub">Aesthetics</span>
      </h1>
      <p class="stage-meaning" data-t="hero.tagline">Leading the future of Global, Holistic Regenerative Medicine.</p>
    </div>

    <!-- One door per live service. Add the store and the Clinical Alliance as doors here when they open. -->
    <div class="hero-row">
      <div class="hero-lead">
        <p data-t="hero.lead"></p>
        <div class="hero-ctas">
          <a class="btn btn-cobalt" href="#plan" data-t="hero.cta"></a>
          <a class="btn btn-ghost" href="#how" data-t="hero.cta2"></a>
        </div>
      </div>
      <a class="door door-clinic" href="#financing">
        <img src="assets/img/tile-microscope-r.webp" alt="" width="480" height="480">
        <span class="door-text">
          <span class="door-label" data-t="door.fin.label"></span>
          <span class="door-sub" data-t="door.fin.sub"></span>
        </span>
      </a>
      <a class="door door-patient" href="skin-check/">
        <img src="assets/img/tile-cells-tr.webp" alt="" width="480" height="480">
        <span class="door-text">
          <span class="door-label" data-t="door.skin.label"></span>
          <span class="door-sub" data-t="door.skin.sub"></span>
        </span>
      </a>
    </div>
  </section>

  <section class="fin" id="financing" aria-labelledby="fin-h">
    <div class="fin-head">
      <h2 id="fin-h" class="sec-title" data-t="fin.title"></h2>
      <p class="fin-lead" data-t="fin.lead"></p>
    </div>
    <ul class="who">
      <li><strong data-t="who.1.t"></strong><span data-t="who.1.d"></span></li>
      <li><strong data-t="who.2.t"></strong><span data-t="who.2.d"></span></li>
      <li><strong data-t="who.3.t"></strong><span data-t="who.3.d"></span></li>
    </ul>
    <div class="do">
      <h3 data-t="do.title"></h3>
      <ol class="do-list">
        <li><strong data-t="do.1.t"></strong><span data-t="do.1.d"></span></li>
        <li><strong data-t="do.2.t"></strong><span data-t="do.2.d"></span></li>
        <li><strong data-t="do.3.t"></strong><span data-t="do.3.d"></span></li>
        <li><strong data-t="do.4.t"></strong><span data-t="do.4.d"></span></li>
        <li><strong data-t="do.5.t"></strong><span data-t="do.5.d"></span></li>
        <li><strong data-t="do.6.t"></strong><span data-t="do.6.d"></span></li>
      </ol>
    </div>
  </section>

  <section class="how" id="how" aria-labelledby="how-h">
    <h2 id="how-h" class="sec-title" data-t="how.title"></h2>
    <ol class="how-steps">
      <li><img class="step-tile" src="assets/img/tile-microscope-l.webp" alt="" width="480" height="480"><span class="how-n">Step 1</span><strong data-t="how.1.t"></strong><span data-t="how.1.d"></span></li>
      <li><img class="step-tile" src="assets/img/tile-dna-top.webp" alt="" width="480" height="480"><span class="how-n">Step 2</span><strong data-t="how.2.t"></strong><span data-t="how.2.d"></span></li>
      <li><img class="step-tile" src="assets/img/tile-pods.webp" alt="" width="480" height="480"><span class="how-n">Step 3</span><strong data-t="how.3.t"></strong><span data-t="how.3.d"></span></li>
      <li><img class="step-tile" src="assets/img/tile-cell-tl.webp" alt="" width="480" height="480"><span class="how-n">Step 4</span><strong data-t="how.4.t"></strong><span data-t="how.4.d"></span></li>
    </ol>
  </section>

  <section class="register" id="plan" aria-labelledby="plan-h">
    <div class="register-head">
      <h2 id="plan-h" data-t="form.title"></h2>
      <p data-t="form.intro"></p>
    </div>
    <div data-register-form data-privacy="privacy/"></div>
  </section>

  <section class="patients" id="patients" aria-labelledby="pat-h">
    <div class="pat-head">
      <h2 id="pat-h" class="sec-title" data-t="pat.title"></h2>
      <p data-t="pat.lead"></p>
    </div>
    <div class="pat-grid">
      <a class="scan-card" href="skin-check/">
        <span class="scan-pic" aria-hidden="true">
          <img src="assets/img/sample-face.jpg" alt="" width="1067" height="1600" loading="lazy">
          <span class="scan-beam"></span>
          <span class="scan-tags"><span style="--d:0s">Lines · mild</span><span style="--d:.6s">Texture · moderate</span><span style="--d:1.2s">Redness · mild</span></span>
        </span>
        <span class="scan-text">
          <span class="scan-k" data-t="sc.kicker"></span>
          <span class="scan-h" data-t="sc.title"></span>
          <span class="scan-p" data-t="sc.body"></span>
          <span class="btn btn-cobalt" data-t="sc.cta"></span>
        </span>
      </a>
      <a class="ask-card" href="ask/">
        <span class="ask-plate" aria-hidden="true">S</span>
        <span class="scan-h" data-t="ask.title"></span>
        <span class="scan-p" data-t="ask.body"></span>
        <span class="ask-q" data-t="ask.sample"></span>
        <span class="ask-go" data-t="ask.cta"></span>
      </a>
    </div>
  </section>

  <section class="founders" id="founders" aria-labelledby="founders-h">
    <h2 id="founders-h" class="sec-title" data-t="founders.title"></h2>
    <div class="founders-grid">
      <div class="founder">
        <div class="monogram" aria-hidden="true">S</div>
        <div>
          <h3 data-t="f1.name"></h3>
          <p class="founder-role" data-t="f1.role"></p>
          <p data-t="f1.bio"></p>
        </div>
      </div>
      <div class="founder">
        <div class="monogram" aria-hidden="true">EJ</div>
        <div>
          <h3 data-t="f2.name"></h3>
          <p class="founder-role" data-t="f2.role"></p>
          <p data-t="f2.bio"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="contact" id="contact" aria-labelledby="contact-h">
    <img src="assets/img/rosette.svg" alt="" class="rosette">
    <h2 id="contact-h" class="sec-title" data-t="contact.title"></h2>
    <p data-t="contact.body"></p>
    <a class="mail" href="mailto:info@alagaaesthetics.nl" data-t="contact.email"></a>
  </section>
</main>

<footer class="foot">
  <img src="assets/img/mark-white.svg" alt="" class="foot-mark">
  <p data-t="footer.copy"></p>
  <a href="privacy/" data-keep-lang data-t="footer.privacy"></a>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/form.js"></script>
<script src="assets/js/site.js"></script>
<script type="module">
  import { mountWreath } from "./assets/js/wreath.js";
  const host = document.querySelector("[data-wreath]");
  if (host) mountWreath(host, { distance: innerWidth < 720 ? 7 : 6, lift: 0.12, sway: 0.1, follow: 0.22 });
</script>
</body>
</html>
