<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alaga Aesthetics by Bosselaar</title>
<meta name="description" content="Regenerative aesthetic products, training and home skincare for clinics and patients in the Netherlands.">
<meta name="theme-color" content="#FCECF0">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-layout="c">
<a class="skip" href="#main" data-t="skip">Skip to content</a>

<header class="bar">
  <a class="brand" href="#top" aria-label="Alaga Aesthetics by Bosselaar">
    <img src="../assets/img/mark-cobalt.svg" alt="" class="brand-mark">
    <span class="brand-name">Alaga Aesthetics <span data-t="brand.by">by Bosselaar</span></span>
  </a>
  <nav class="bar-nav" aria-label="Main">
    <a href="#practitioners" data-t="nav.practitioners"></a>
    <a href="#patients" data-t="nav.patients"></a>
    <a href="#founders" data-t="nav.founders"></a>
    <a href="#register" data-t="nav.register"></a>
  </nav>
  <button type="button" class="lang" data-lang-toggle>Nederlands</button>
</header>

<main id="main">
  <section class="stage" id="top" aria-labelledby="stage-h">
    <div class="stage-text">
      <h1 id="stage-h" class="stage-word"><span data-t="def.word">alaga</span></h1>
      <p class="stage-def"><span class="stage-ipa" data-t="def.ipa">/ɐˈlaɡa/</span> <span class="stage-lang" data-t="def.lang">Filipino</span></p>
      <p class="stage-meaning" data-t="def.meaning">Care, the act of looking after someone.</p>
      <p class="stage-lead" data-t="intro.lead"></p>

      <div class="slides" role="list">
        <a class="slide slide-prac" href="#practitioners" role="listitem">
          <span class="slide-label"><span data-t="c.slide.prac">Practitioners</span></span>
          <span class="slide-glass"><img src="../assets/img/tile-cell-br.webp" alt="" width="480" height="480"></span>
        </a>
        <a class="slide slide-pat" href="#patients" role="listitem">
          <span class="slide-label"><span data-t="c.slide.pat">Patients</span></span>
          <span class="slide-glass"><img src="../assets/img/tile-dots-r.webp" alt="" width="480" height="480"></span>
        </a>
      </div>
    </div>

    <figure class="scope" aria-labelledby="scope-cap">
      <div class="scope-field" data-scope>
        <img class="scope-img"
             src="https://images.unsplash.com/photo-1716833322987-bfef9f913822?auto=format&fit=crop&w=1400&h=1400&q=75"
             onerror="this.onerror=null;this.src='../assets/img/tile-tissue-bl.webp'"
             width="1400" height="1400" alt="" data-t-alt="photo.epidermis.alt">
        <span class="scope-reticle" aria-hidden="true"></span>
      </div>
      <div class="focus">
        <label for="focus-knob" data-t="c.focus">Turn to focus</label>
        <input id="focus-knob" type="range" min="0" max="100" value="100" data-focus>
      </div>
      <figcaption id="scope-cap" data-t="photo.epidermis.cap"></figcaption>
    </figure>
  </section>

  <section class="sheet about" id="about" aria-labelledby="about-h">
    <h2 id="about-h" data-t="nav.about">About</h2>
    <div class="about-body">
      <p class="about-text" data-t="intro.body"></p>
      <p class="about-status"><span class="stain-dot" aria-hidden="true"></span><span data-t="intro.status"></span></p>
    </div>
  </section>

  <section class="path path-prac" id="practitioners" aria-labelledby="prac-h">
    <div class="path-inner">
      <div class="path-head">
        <p class="path-for" data-t="prac.name">For practitioners</p>
        <h2 id="prac-h" data-t="prac.title">The Clinical Alliance</h2>
        <p class="path-lead" data-t="prac.lead"></p>
        <img class="path-photo" src="https://images.unsplash.com/photo-1552256031-811fa8f0a7b1?auto=format&fit=crop&w=900&h=700&q=72" width="900" height="700" loading="lazy" alt="" data-t-alt="photo.dropper.alt">
      </div>
      <ul class="offer">
        <li><h3 data-t="prac.i1.t"></h3><p data-t="prac.i1.d"></p></li>
        <li><h3 data-t="prac.i2.t"></h3><p data-t="prac.i2.d"></p></li>
        <li><h3 data-t="prac.i3.t"></h3><p data-t="prac.i3.d"></p></li>
        <li><h3 data-t="prac.i4.t"></h3><p data-t="prac.i4.d"></p></li>
        <li><h3 data-t="prac.i5.t"></h3><p data-t="prac.i5.d"></p></li>
        <li class="offer-cta"><a class="btn btn-hema" href="#register" data-t="prac.cta"></a></li>
      </ul>
    </div>
  </section>

  <section class="path path-pat" id="patients" aria-labelledby="pat-h">
    <div class="path-inner">
      <div class="path-head">
        <p class="path-for" data-t="pat.name">For patients</p>
        <h2 id="pat-h" data-t="pat.title">The Skin Concierge</h2>
        <p class="path-lead" data-t="pat.lead"></p>
        <img class="path-photo" src="https://images.unsplash.com/photo-1619451427882-6aaaded0cc61?auto=format&fit=crop&w=900&h=700&q=72" width="900" height="700" loading="lazy" alt="" data-t-alt="photo.lotion.alt">
      </div>
      <ul class="offer">
        <li><h3 data-t="pat.i1.t"></h3><p data-t="pat.i1.d"></p></li>
        <li><h3 data-t="pat.i2.t"></h3><p data-t="pat.i2.d"></p></li>
        <li><h3 data-t="pat.i3.t"></h3><p data-t="pat.i3.d"></p></li>
        <li class="offer-cta"><a class="btn btn-eosin" href="#contact" data-t="pat.cta"></a></li>
      </ul>

    <p class="stage-note" data-t="stage.note"></p>

  <section class="sheet why" id="why" aria-labelledby="why-h">
    <div class="why-text">
      <h2 id="why-h" data-t="why.title">Why Alaga</h2>
      <p class="why-p1" data-t="why.p1"></p>
      <p data-t="why.p2"></p>
    </div>
    <figure class="cycle">
      <svg viewBox="0 0 320 300" role="img" aria-labelledby="cycle-t">
        <title id="cycle-t" data-t="loop.title">How it fits together</title>
        <circle cx="160" cy="152" r="104" class="cycle-ring"/>
        <circle cx="160" cy="48" r="40" class="cy-a"/>
        <circle cx="250" cy="204" r="40" class="cy-b"/>
        <circle cx="70" cy="204" r="40" class="cy-c"/>
        <text x="160" y="53" data-t="loop.n1">Alaga</text>
        <text x="250" y="209" data-t="loop.n2">Clinic</text>
        <text x="70" y="209" data-t="loop.n3">Patient</text>
      </svg>
      <figcaption>
        <ol class="cycle-steps">
          <li data-t="loop.s1"></li>
          <li data-t="loop.s2"></li>
          <li data-t="loop.s3"></li>
        </ol>
      </figcaption>
    </figure>
  </section>

  <section class="sheet founders" id="founders" aria-labelledby="founders-h">
    <h2 id="founders-h" data-t="founders.title">Founders</h2>
    <div class="founders-grid">
      <article class="founder">
        <h3 data-t="f1.name"></h3>
        <p class="founder-role" data-t="f1.role"></p>
        <p data-t="f1.bio"></p>
      </article>
      <article class="founder">
        <h3 data-t="f2.name"></h3>
        <p class="founder-role" data-t="f2.role"></p>
        <p data-t="f2.bio"></p>
      </article>
    </div>
  </section>

  <section class="sheet roadmap" id="roadmap" aria-labelledby="roadmap-h">
    <h2 id="roadmap-h" data-t="roadmap.title">Roadmap</h2>
    <ol class="slidebox">
      <li><span class="sb-label" data-t="r1.when"></span><span class="sb-text" data-t="r1.what"></span></li>
      <li><span class="sb-label" data-t="r2.when"></span><span class="sb-text" data-t="r2.what"></span></li>
      <li><span class="sb-label" data-t="r3.when"></span><span class="sb-text" data-t="r3.what"></span></li>
    </ol>
  </section>

  <section class="register" id="register" aria-labelledby="register-h">
    <div class="register-head">
      <h2 id="register-h" data-t="form.title">Register your clinic</h2>
      <p data-t="form.intro"></p>
    </div>
    <div data-register-form data-privacy="../privacy/"></div>
  </section>

  <section class="sheet contact" id="contact" aria-labelledby="contact-h">
    <h2 id="contact-h" data-t="contact.title">Contact</h2>
    <div>
      <p data-t="contact.body"></p>
      <a class="mail" href="mailto:info@alagaaesthetics.nl" data-t="contact.email"></a>
    </div>
  </section>
</main>

<footer class="foot">
  <img src="../assets/img/mark-white.svg" alt="" class="foot-mark">
  <p data-t="footer.copy"></p>
  <a href="../privacy/" data-keep-lang data-t="footer.privacy"></a>
</footer>

<script src="../assets/js/content.js"></script>
<script src="../assets/js/form.js"></script>
<script src="../assets/js/site.js"></script>
<script>
  // Focus knob: the field starts out of focus and pulls sharp on load; the knob lets the visitor refocus it.
  (function () {
    const field = document.querySelector("[data-scope]");
    const knob = document.querySelector("[data-focus]");
    if (!field || !knob) return;
    const set = (v) => {
      const off = (100 - v) / 100;
      field.style.setProperty("--blur", (off * 16).toFixed(2) + "px");
      field.style.setProperty("--zoom", (1 + off * 0.35).toFixed(3));
    };
    knob.addEventListener("input", () => { field.classList.add("is-manual"); set(+knob.value); });
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { set(100); return; }
    set(0);
    requestAnimationFrame(() => requestAnimationFrame(() => { field.classList.add("is-pulling"); set(100); }));
  })();
</script>
</body>
</html>
